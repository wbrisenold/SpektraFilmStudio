[package]
name = "spektrastudio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

lightcraft-develop = { path = "../../Vendor/lightcraft/crates/develop" }
lightcraft-pipeline = { path = "../../Vendor/lightcraft/crates/pipeline" }
lightcraft-raster = { path = "../../Vendor/lightcraft/crates/raster" }
lightcraft-raw = { path = "../../Vendor/lightcraft/crates/raw" }
lightcraft-codecs = { path = "../../Vendor/lightcraft/crates/codecs" }
lightcraft-color = { path = "../../Vendor/lightcraft/crates/color" }
lightcraft-catalog = { path = "../../Vendor/lightcraft/crates/catalog" }
lightcraft-preview = { path = "../../Vendor/lightcraft/crates/preview" }
lightcraft-engine = { path = "../../Vendor/lightcraft/crates/engine" }
lightcraft-segment = { path = "../../Vendor/lightcraft/crates/segment" }
lightcraft-merge = { path = "../../Vendor/lightcraft/crates/merge" }

[profile.release]
lto = "thin"
codegen-units = 1
