[package]
name = "spektrastudio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

lightcraft-develop = { path = "../../Vendor/lightcraft/crates/develop" }

[profile.release]
lto = "thin"
codegen-units = 1
